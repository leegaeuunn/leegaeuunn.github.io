{{/* Photo Mosaic Custom View - Magazine Style Layout */}}
<div class="photo-mosaic-container">
  <div class="mosaic-grid">
    <!-- Top Row - Mixed Sizes -->
    <div class="mosaic-item large-portrait" style="background-image: url('{{ .Site.BaseURL }}assets/media/avatar.jpg');">
      <div class="mosaic-overlay">
        <h3>이가은</h3>
        <p>웹 개발자 지망생</p>
      </div>
    </div>
    
    <div class="mosaic-item medium-square" style="background-image: url('{{ .Site.BaseURL }}assets/media/coding.jpg');">
      <div class="mosaic-overlay">
        <span>코딩</span>
      </div>
    </div>
    
    <div class="mosaic-item small-wide" style="background-image: url('{{ .Site.BaseURL }}assets/media/data_science.jpg');">
      <div class="mosaic-overlay">
        <span>AI</span>
      </div>
    </div>
    
    <!-- Middle Row - Text Block + Photos -->
    <div class="text-block">
      <div class="text-content">
        <h4>My Journey</h4>
        <p>프론트엔드에서 시작해<br>풀스택까지의 여정을<br>함께해주세요</p>
        <div class="text-highlight">개발자로서의 성장</div>
      </div>
    </div>
    
    <div class="mosaic-item medium-portrait" style="background-image: url('{{ .Site.BaseURL }}assets/media/web_develop.jpg');">
      <div class="mosaic-overlay">
        <span>웹 개발</span>
      </div>
    </div>
    
    <div class="mosaic-item small-square" style="background-image: url('{{ .Site.BaseURL }}assets/media/human_computer_interaction.jpg');">
      <div class="mosaic-overlay">
        <span>HCI</span>
      </div>
    </div>
    
    <!-- Bottom Row -->
    <div class="mosaic-item wide" style="background-image: url('{{ .Site.BaseURL }}assets/media/fukuoka.jpg');">
      <div class="mosaic-overlay">
        <h4>여행</h4>
        <p>새로운 경험과 발견</p>
      </div>
    </div>
    
    <div class="mosaic-item medium-square" style="background-image: url('{{ .Site.BaseURL }}assets/media/database.jpg');">
      <div class="mosaic-overlay">
        <span>Database</span>
      </div>
    </div>
    
    <div class="mosaic-item small-square" style="background-image: url('{{ .Site.BaseURL }}assets/media/iot.jpg');">
      <div class="mosaic-overlay">
        <span>IoT</span>
      </div>
    </div>
  </div>
</div>
