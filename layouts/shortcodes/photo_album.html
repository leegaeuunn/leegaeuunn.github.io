{{ $page := .Page }}
{{ $albumName := .Get "album" | default "hanoi" }}
{{ $imageCount := .Get "count" | default 20 }}

<style>
/* 사진첩 CSS - 통합 버전 */
.photo-album {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

.photo-album h1 {
  text-align: center;
  padding: 20px 0;
  color: #333;
  margin: 0;
}

.photo-album .album {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 4px;
  padding: 10px;
  max-width: 1250px;
  margin: 0 auto;
  box-sizing: border-box;
}

.photo-album .album img {
  width: 200px;
  height: 250px;
  border-radius: 8px;
  cursor: pointer;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  display: block;
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

.photo-album .album img:hover {
  transform: scale(1.03);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
}

.photo-album .modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.8);
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

.photo-album .modal.show {
  display: flex;
}

.photo-album .modal img {
  max-width: 90%;
  max-height: 80%;
  border-radius: 10px;
  animation: fadeIn 0.3s ease-in-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

/* 반응형 */
@media (max-width: 480px) {
  .photo-album .album { 
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 2px;
  }
}
@media (min-width: 481px) and (max-width: 768px) {
  .photo-album .album { 
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 3px;
  }
}
@media (min-width: 1201px) {
  .photo-album .album { 
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 6px;
  }
}
</style>

<div class="photo-album">
  <!-- <h1>📸 {{ $albumName | title }} 여행 사진첩</h1>
   -->
  <div class="album" id="album-{{ $albumName }}">
    {{ range $i := (seq 1 $imageCount) }}
      <img src="/travel/{{ $albumName }}/img{{ $i }}.png" 
           alt="{{ $albumName }} 여행 사진 {{ $i }}" 
           onerror="this.style.display='none'"
           onclick="openModal(this.src, this.alt)" />
    {{ end }}
  </div>

  <!-- 팝업(모달) 영역 -->
  <div class="modal" id="modal-{{ $albumName }}" onclick="closeModal()">
    <img id="modalImage-{{ $albumName }}" alt="확대된 이미지" />
  </div>
</div>

<script>
function openModal(src, alt) {
  const modal = document.getElementById('modal-{{ $albumName }}');
  const modalImage = document.getElementById('modalImage-{{ $albumName }}');
  
  modalImage.src = src;
  modalImage.alt = alt;
  modal.classList.add('show');
}

function closeModal() {
  const modal = document.getElementById('modal-{{ $albumName }}');
  modal.classList.remove('show');
}

// ESC 키로 모달 닫기
document.addEventListener('keydown', function(event) {
  if (event.key === 'Escape') {
    const modal = document.getElementById('modal-{{ $albumName }}');
    modal.classList.remove('show');
  }
});
</script>
