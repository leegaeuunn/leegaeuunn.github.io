{{ $page := .Page }}
{{ $albumName := .Get "album" | default "hanoi" }}
{{ $imageCount := .Get "count" | default 21 }}

<style>
/* 페이지별 특수 설정 - 사진첩 페이지에만 적용 */
.article-container {
  max-width: 100%; 
  margin: 4rem;
  padding-bottom: 2rem;
}

.pt-3 {
  display: none !important;
}

@media (max-width: 768px) {
  .article-container {
    margin: 1rem;
  }
}

@media (max-width: 480px) {
  .article-container {
    margin: 0.5rem;
  }
}

/* 사진첩 CSS - Wowchemy 전역 CSS 충돌 방지 */
.photo-album {
  all: unset !important;                /* Wowchemy의 상속 스타일 완전히 초기화 */
  display: block !important;
  margin: 0 !important;
  padding: 0 !important;
  box-sizing: border-box !important;
}

/* 사진첩 이미지 스타일 - Wowchemy 전역 CSS 충돌 방지 */
.photo-album .album {
  display: grid !important;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)) !important;
  column-gap: 4px !important;  /* 가로 간격 명시 */
  row-gap: 4px !important;     /* 세로 간격 명시 */
  justify-items: center;       /* 중앙 정렬 */
  align-items: center;
  padding: 10px !important;
  max-width: 1500px;
  margin: 0 auto !important;
  background-color: transparent;
  box-sizing: border-box !important;
}

/* 각 사진 스타일 - Wowchemy 전역 CSS 충돌 방지 + 로딩 최적화 */
.photo-album .album img {
  width: 200px !important;
  height: 300px !important;
  border-radius: 8px;
  cursor: pointer;
  transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.3s ease;
  display: block !important;
  margin: 0 !important;
  padding: 0 !important;
  box-sizing: border-box !important;
  object-fit: cover !important;
  /* EXIF 회전 정보 자동 적용 */
  image-orientation: from-image;
  /* 로딩 최적화 */
  background-color: #f0f0f0;
  opacity: 0;
  animation: fadeInImage 0.5s ease-in-out forwards;
}

/* 이미지 로딩 애니메이션 */
@keyframes fadeInImage {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* 로딩 중 스켈레톤 효과 */
.photo-album .album img:not([src]) {
  background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
  background-size: 200% 100%;
  animation: loading 1.5s infinite;
}

@keyframes loading {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.photo-album .album img:hover {
  transform: scale(1.03);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
}

/* 모달(팝업) 영역 */
.photo-album .modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.8);
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

/* 클릭 시 팝업 표시 */
.photo-album .modal.show {
  display: flex;
}

/* 팝업 이미지 스타일 */
.photo-album .modal img {
  max-width: 90%;
  max-height: 80%;
  border-radius: 10px;
  animation: fadeIn 0.3s ease-in-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

/* 반응형 - Wowchemy 전역 CSS 충돌 방지 */
@media (max-width: 600px) {
  .photo-album .album {
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)) !important;
    column-gap: 2px !important;
    row-gap: 2px !important;
  }
  .photo-album .album img {
    width: 120px !important;
    height: 180px !important;
  }
}

@media (min-width: 601px) and (max-width: 1200px) {
  .photo-album .album {
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)) !important;
    column-gap: 4px !important;
    row-gap: 4px !important;
  }
  .photo-album .album img {
    width: 180px !important;
    height: 270px !important;
  }
}

@media (min-width: 1201px) {
  .photo-album .album {
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)) !important;
    column-gap: 6px !important;
    row-gap: 6px !important;
  }
  .photo-album .album img {
    width: 200px !important;
    height: 300px !important;
  }
}

</style>

<div class="travel-container">
  <div class="photo-album">
    <!-- <h1>📸 {{ $albumName | title }} 사진첩</h1>
     -->
    <div class="album" id="album-{{ $albumName }}">
    {{ range $i := (seq 1 $imageCount) }}
      {{ $extension := "jpeg" }}
      {{ $imagePath := printf "/en/travel/%s/img%d.%s" $albumName $i $extension }}
      <img src="{{ $imagePath }}" 
           alt="{{ $albumName }} 사진 {{ $i }}" 
           loading="lazy"
           decoding="async"
           fetchpriority="low"
           onerror="this.style.display='none'"
           onclick="openModal(this.src, this.alt)" />
    {{ end }}
  </div>

    <!-- 팝업(모달) 영역 -->
    <div class="modal" id="modal-{{ $albumName }}" onclick="closeModal()">
      <img id="modalImage-{{ $albumName }}" alt="확대된 이미지" />
    </div>
  </div>
</div>

<script>
// 이미지 로딩 최적화
document.addEventListener('DOMContentLoaded', function() {
  const images = document.querySelectorAll('#album-{{ $albumName }} img');
  
  // Intersection Observer로 지연 로딩 구현
  const imageObserver = new IntersectionObserver((entries, observer) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const img = entry.target;
        if (img.dataset.src) {
          img.src = img.dataset.src;
          img.removeAttribute('data-src');
          observer.unobserve(img);
        }
      }
    });
  });

  images.forEach(img => {
    if (img.dataset.src) {
      imageObserver.observe(img);
    }
  });
});

function openModal(src, alt) {
  const modal = document.getElementById('modal-{{ $albumName }}');
  const modalImage = document.getElementById('modalImage-{{ $albumName }}');
  
  modalImage.src = src;
  modalImage.alt = alt;
  modal.classList.add('show');
}

function closeModal() {
  const modal = document.getElementById('modal-{{ $albumName }}');
  modal.classList.remove('show');
}

// ESC 키로 모달 닫기
document.addEventListener('keydown', function(event) {
  if (event.key === 'Escape') {
    const modal = document.getElementById('modal-{{ $albumName }}');
    modal.classList.remove('show');
  }
});
</script>
