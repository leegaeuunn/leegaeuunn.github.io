# Appearance

# appearance:
#   theme_day: mode
#   theme_night: mode
#   font: native
#   font_size: L
#   color: pink

appearance:
  theme_day: rose
  theme_night: dark
  font: custom
  font_size: L


# SEO

# marketing:
  seo:
    site_type: Person
    #site_type: Organization
    local_business_type: ''
    org_name: '전북대학교 컴퓨터인공지능학부'
    description: '전북대학교 컴퓨터인공지능학부 이가은의 포트폴리오 입니다.'
    twitter: ''
    open_graph:
      title: '전북대학교 이가은 | 포트폴리오'
      image: 'https://igaeun8.github.io/assets/media/logo.png'
  analytics:
    google: 'a7iVzef2Zp3fd2Fg0BNgp2R7iR-jRh_bZPFrt20xfIE'
    google_analytics: 'a7iVzef2Zp3fd2Fg0BNgp2R7iR-jRh_bZPFrt20xfIE'
    baidu_tongji: ''
    google_tag_manager: ''
    microsoft_clarity: ''
  verification:
    google: 'a7iVzef2Zp3fd2Fg0BNgp2R7iR-jRh_bZPFrt20xfIE'
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    align: c
    fixed_to_top: false
    show_logo: true
    show_language: true
    show_day_night: true
    show_search: true
    highlight_active_link: true
    logo:
      text: ""  # Text for logo (if any)
      filename: "assets/media/logo.png"  # Ensure the file exists in `assets/media/`

      

# Site footer

footer:
  copyright:
    notice: '© {year} Me. This work is licensed under {license}'
    license:
      enable: true
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization

locale: #고쳐야하나?
  date_format: 'Jan 23, 2003'
  time_format: '11:04 PM'
  #address_format: en-us

# Site features
features:
  syntax_highlighter:
    enable: false
    extra_languages:
      - r
      - latex
  math:
    enable: false
  privacy_pack:
    enable: false
  repository: 
    url: 'https://github.com/igaeun8/igaeun8.github.io'
    content_dir: content
    branch: main
  avatar:
    gravatar: false
    shape: circle
  comment:
    provider: ''
    disqus:
      shortname: ''
      show_count: true
    commento:
      url: ''
    giscus:
      repo: ''
      repo_id: ''
      category: ''
      category_id: ''
  search: 
    provider: wowchemy
    algolia:
      app_id: ''
      api_key: ''
      index_name: ''
      show_logo: false
  map:
    provider: 'mapnik'
    api_key: ''
    zoom: 15

# Extensions

extensions:
  decap_cms:
    branch: main
    local_backend: false
  academicons:
    enable: true

# Citation style

publications:
  date_format: January 2006 #고쳐야하나?
  citation_style: apa

ogImage: "assets/media/logo.png"  # Ensure the image exists at this path

